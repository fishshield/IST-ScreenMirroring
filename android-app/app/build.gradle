plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.example.screencast.controller"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.screencast.controller"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        // The app itself is unprivileged. Shizuku's provider supplies the
        // user-authorized shell/root binder; no elevation code belongs here.
    }

    buildTypes {
        debug {
            // Debug-only: expose the foreground service so the
            // "Shizuku lost, session keeps running" behaviour can be exercised
            // from adb without going through the app UI. Release keeps it
            // private.
            manifestPlaceholders = [fgsExported: "true"]
        }
        release {
            manifestPlaceholders = [fgsExported: "false"]
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
}
