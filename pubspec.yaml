name: screen_cast_demo
description: Cross-platform screen-cast demo skeleton. Flutter UI/signaling + an Android app_process capture server.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  ffi: ^2.1.3
  path: ^1.9.1
  screen_cast_windows:
    path: packages/screen_cast_windows
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/server/screencast-server.jar
